<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buzzybox — Handwritten letters for the people you love</title>
  <meta name="description" content="Buzzybox is a cozy iPad app for writing, sending, and rereading real handwritten letters with the people you trust." />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/favicon.png" />
  <meta property="og:title" content="Buzzybox" />
  <meta property="og:description" content="Handwritten letters for the people you love." />
  <meta property="og:image" content="assets/app-desk.jpg" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-head">
    <img src="assets/favicon.png" alt="Buzzybox app icon" />
    <span class="name">Buzzybox</span>
    <nav>
      <a href="support.html">Support</a>
      <a href="privacy.html">Privacy</a>
    </nav>
  </header>

  <main>
    <!-- The product IS the pitch. The icon lives in the header at 34px; the
         hero is the desk itself, which says "write by hand" and "send and
         receive" in one image and needs no paragraph to explain it. -->
    <section class="hero">
      <h1>Handwritten letters for the people you love.</h1>
      <p class="tagline">A quiet writing desk for iPad.</p>
      <span class="badge">Coming soon to iPad</span>
    </section>

    <figure class="shot">
      <img src="assets/app-desk.jpg"
           alt="The Buzzybox writing desk on iPad — a mailbox, a stack of paper and pen, drafts, and a sealed envelope"
           width="1600" height="1112" />
    </figure>

    <!-- One line, not three cards. The headline and the screenshot already
         cover writing and sending; the only thing left that a parent needs
         and cannot see is who is allowed to reach their child. -->
    <section class="assurance">
      <p>Every contact is approved by an adult. No feeds, no ads, no strangers.</p>
    </section>
  </main>

  <footer>
    <nav>
      <a href="support.html">Support</a>
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms</a>
    </nav>
    <span class="fine">© 2026 Buzzybox · Made with care for letter-writers everywhere.</span>
  </footer>
</body>
</html>
