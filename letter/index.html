<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <title>Your Postmello letter</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; padding: 0;
      background: #fbf8f3;
      color: #2a2118;
      font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    /* The handwritten letter is the hero — give it a wide column so it fills
       the screen instead of a narrow strip. The page JPEG is 1600px, so it
       stays sharp well past this. */
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
    /* Brand letterhead — lives outside #main so the JS render never wipes it,
       and shows during loading and on the quiet (expired/missing) states. */
    .brand {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      padding: 26px 16px 0;
    }
    .brand img { width: 44px; height: 44px; }
    .brand span { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
    h1 { font-size: 26px; text-align: center; margin: 18px 0 6px; letter-spacing: -0.02em; }
    .subtitle { text-align: center; color: #9b8f7e; margin: 0 0 28px; font-size: 15px; }
    figure { margin: 0 0 24px; text-align: center; }
    figure img {
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(42, 33, 24, 0.14);
      background: #fff;
    }
    /* The envelope is a transparent cutout, so it gets no white card —
       drop-shadow (alpha-aware) instead of the pages' rectangular box-shadow
       so the soft shadow follows the envelope's own shape. */
    .envelope img {
      /* ~80% of the letter page's width (pages are max-width:100%) so the
         envelope reads as the smaller object above the letter, not a sibling
         the same size. Capped so it never gets huge on wide screens. */
      max-width: min(640px, 80%);
      background: transparent;
      border-radius: 0;
      box-shadow: none;
      filter: drop-shadow(0 10px 20px rgba(60, 42, 20, 0.22));
    }
    .writeback {
      margin-top: 40px;
      background: #fff;
      border: 1px solid rgba(42, 33, 24, 0.10);
      border-radius: 16px;
      padding: 26px 24px;
    }
    .writeback h2 { margin: 0 0 12px; font-size: 20px; }
    .writeback ol { margin: 0 0 18px; padding-left: 22px; line-height: 1.7; }
    .code {
      font-size: 34px; font-weight: 700; letter-spacing: 5px;
      text-align: center; padding: 14px 0; margin-bottom: 16px;
      background: #fbf8f3; border: 1px solid rgba(42,33,24,0.10); border-radius: 12px; user-select: all;
    }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .actions button, .actions a {
      font-size: 16px; font-weight: 600; padding: 12px 24px;
      border-radius: 10px; border: none; cursor: pointer; text-decoration: none;
      display: inline-block;
    }
    #copy-code { background: #fbf8f3; border: 1px solid rgba(42,33,24,0.14); color: #2a2118; }
    .get-app { background: #c8402f; color: #fff; }
    .hint { color: #9b8f7e; font-size: 13px; text-align: center; margin: 16px 0 0; }
    .qr { text-align: center; margin-top: 12px; }
    .qr img {
      width: 156px; height: 156px; border-radius: 12px;
      box-shadow: 0 4px 14px rgba(42, 33, 24, 0.12);
    }
    .privacy { color: #9b8f7e; font-size: 12px; text-align: center; margin-top: 36px; }
    .quiet { text-align: center; margin-top: 18vh; }
    .quiet h1 { font-size: 22px; }
    .quiet p { color: #6b5d4b; font-size: 15px; line-height: 1.6; }
  </style>
</head>
<body>
  <header class="brand">
    <img src="/assets/mark.png" alt="" />
    <span>Postmello</span>
  </header>
  <main id="main">
    <div class="quiet" id="loading">
      <h1>Opening your letter&hellip;</h1>
    </div>
  </main>
  <script>
    (function () {
      // The private token is the credential; this page just renders the
      // payload from the Postmello letter service. Served from buzzybox.app
      // because Supabase does not render HTML on its shared functions domain.
      var ENDPOINT = 'https://jbrxtkedjahpbzrqxeos.supabase.co/functions/v1/letter-page';
      var main = document.getElementById('main');

      function el(tag, attrs, children) {
        var node = document.createElement(tag);
        Object.keys(attrs || {}).forEach(function (k) {
          if (k === 'text') { node.textContent = attrs[k]; }
          else { node.setAttribute(k, attrs[k]); }
        });
        (children || []).forEach(function (c) { node.appendChild(c); });
        return node;
      }

      function quiet(title, message) {
        main.innerHTML = '';
        main.appendChild(el('div', { 'class': 'quiet' }, [
          el('h1', { text: title }),
          el('p', { text: message }),
        ]));
      }

      function renderLetter(data) {
        document.title = 'A letter from ' + data.from_name;
        main.innerHTML = '';
        main.appendChild(el('h1', { text: 'You\u2019ve got a letter, ' + data.to_name + '!' }));
        main.appendChild(el('p', { 'class': 'subtitle', text: 'Handwritten for you by ' + data.from_name }));
        if (data.envelope_url) {
          main.appendChild(el('figure', { 'class': 'envelope' }, [
            el('img', { src: data.envelope_url, alt: 'Envelope from ' + data.from_name }),
          ]));
        }
        (data.page_urls || []).forEach(function (url, i) {
          main.appendChild(el('figure', { 'class': 'page' }, [
            el('img', { src: url, alt: 'Letter page ' + (i + 1) }),
          ]));
        });
        if (data.connect_code) {
          var section = el('section', { 'class': 'writeback' });
          section.appendChild(el('h2', { text: 'Write back to ' + data.from_name }));
          var ol = el('ol');
          ['On an iPad, download Apple\u2019s TestFlight app from the App Store.',
           'Tap \u201cGet Postmello\u201d below to install Postmello with our TestFlight link.',
           'Open Postmello and create or pick a desk.',
           'Enter ' + data.from_name + '\u2019s connect code below.',
           'Wait for ' + data.from_name + '\u2019s side to approve.'
          ].forEach(function (step) { ol.appendChild(el('li', { text: step })); });
          section.appendChild(ol);
          var code = el('div', { 'class': 'code', id: 'connect-code', text: data.connect_code });
          section.appendChild(code);
          var copy = el('button', { type: 'button', id: 'copy-code', text: 'Copy ' + data.from_name + '\u2019s Code' });
          var testflightUrl = 'https://testflight.apple.com/join/mUq9G292';
          var appUrl = data.get_app_url || testflightUrl;
          section.appendChild(el('div', { 'class': 'actions' }, [
            copy,
            el('a', { 'class': 'get-app', href: appUrl, text: 'Get Postmello' }),
          ]));
          section.appendChild(el('p', { 'class': 'hint',
            text: 'Entering the code only asks to connect \u2014 ' + data.from_name + '\u2019s side still approves it.' }));
          if (appUrl === testflightUrl) {
            // The QR asset encodes exactly this URL; hide it if the env
            // ever repoints the button (e.g. App Store launch).
            section.appendChild(el('p', { 'class': 'hint',
              text: 'Not on the iPad right now? Open this letter on the iPad and tap \u201cGet Postmello\u201d there \u2014 or point the iPad\u2019s camera at this code:' }));
            section.appendChild(el('div', { 'class': 'qr' }, [
              el('img', { src: '/assets/testflight-qr.png', width: '156', height: '156',
                alt: 'QR code that opens the Postmello TestFlight invite' }),
            ]));
          }
          main.appendChild(section);
          copy.addEventListener('click', function () {
            var value = code.textContent.trim();
            function done() {
              var original = copy.textContent;
              copy.textContent = 'Copied!';
              setTimeout(function () { copy.textContent = original; }, 1600);
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(value).then(done, done);
            } else {
              var range = document.createRange();
              range.selectNodeContents(code);
              var selection = window.getSelection();
              selection.removeAllRanges();
              selection.addRange(range);
              try { document.execCommand('copy'); } catch (_) { /* best effort */ }
              selection.removeAllRanges();
              done();
            }
          });
        }
        main.appendChild(el('p', { 'class': 'privacy',
          text: 'This private page is just for you and expires 30 days after delivery.' }));
      }

      var token = new URLSearchParams(window.location.search).get('t');
      if (!token) {
        quiet('No letter here', 'We couldn\u2019t find a letter at this link. Double-check the link from your email.');
        return;
      }
      fetch(ENDPOINT + '?t=' + encodeURIComponent(token) + '&format=json')
        .then(function (res) { return res.json().then(function (d) { return d; }); })
        .then(function (data) {
          if (data.status === 'ok') { renderLetter(data); return; }
          if (data.status === 'expired') {
            quiet('This letter has been put away',
                  'The private link for this letter is no longer available. Ask the sender to mail you a new one.');
            return;
          }
          quiet('No letter here', 'We couldn\u2019t find a letter at this link. Double-check the link from your email.');
        })
        .catch(function () {
          quiet('The mailbox is out of reach', 'Something went wrong opening your letter. Please try again in a moment.');
        });
    })();
  </script>
</body>
</html>
