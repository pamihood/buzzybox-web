<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Postmello share card - source</title>
  <!-- The 1200x630 image a Postmello link unfurls as, authored as a PAGE rather
       than composed in PIL. That is the whole point: the card is rendered by the
       same browser, with the same webfonts and the same tokens as the site, so
       it cannot drift into a different typeface than the page it points at.
       `make-og-card.py` shoots this file at 2x and downsamples.

       IT DRIFTED ANYWAY (2026-08-23). The homepage moved onto its own design
       system on the 23rd - Fraunces headings, Plus Jakarta Sans sentences,
       Courier Prime apparatus - and this file kept rendering the previous
       one: a Nunito 800 headline in a rounded sans against a page whose H1 is
       a serif. The card looked like a different product. So the rule the
       comment above states has to be ACTED on when the site restyles: when
       home.css changes face or token, change it here and rerun the script.

       Not linked from anywhere and not in the sitemap - it is a source file
       that happens to be HTML. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- The site's three families, plus Rubik for the wordmark ONLY - the mark
       is Rubik 600 uppercase at +0.025em in #2C231D wherever it appears, and
       that is a brand spec rather than a page style. Do not set the headline
       in it. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&amp;family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&amp;family=Plus+Jakarta+Sans:wght@400..800&amp;family=Rubik:wght@600&amp;display=swap" />
  <style>
    /* Straight from home.css. If a token moves there, move it here. */
    :root {
      --ink-900: #2B231D;
      --ink-600: #746456;
      --ink-mark: #2C231D;
      --terracotta-600: #C85A32;
      --parchment-100: #FAF7F2;
      --line: #DAC6B4;
      --font-serif: "Fraunces", Georgia, serif;
      --font-sans: "Plus Jakarta Sans", system-ui, sans-serif;
      --font-mono: "Courier Prime", ui-monospace, monospace;
      --font-mark: "Rubik", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px; height: 630px;
      background: var(--parchment-100);
      font-family: var(--font-sans);
      color: var(--ink-900);
      display: grid;
      grid-template-columns: 470px 1fr;
      align-items: center;
      gap: 24px;
      padding: 0 0 0 64px;
      overflow: hidden;
      position: relative;
    }
    /* The site's own grain, at the site's own cadence. */
    body::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image: url("../assets/paper-grain.png");
      background-size: 128px;
    }
    /* THE WORDMARK IS "Postmello", NOT "POSTMELLO" (Patrick, 2026-08-23).
       This supersedes the 2026-08-15 spec, which set the mark uppercase at
       +0.025em and was recorded as settled. The reasoning for the change:
       uppercase reads as a postal SERVICE, a label stamped on equipment, a
       tech company - and the brand has matured past that. Title case reads as
       a proper name: warmer, quieter, more literary, and the thing you could
       print on a stationery box, which is where this brand plausibly goes.
       UPPERCASE survives as a SECONDARY graphic treatment - stamps, mailbox
       plaques, packaging, and in-product surfaces where the postal aesthetic
       is the point. It is no longer the wordmark.
       Tracking goes with it: +0.025em opens uppercase, which needs it, and
       loosens title case, which does not. Slightly negative instead.
       The lockup is ~12% larger than it was. This card is a thumbnail in
       somebody else's feed long before it is a 1200px image, and the mark is
       the first thing to disappear at 400px wide. The wordmark does the
       branding work at that size; the postbox is a warm detail that survives
       as a red shape rather than as a readable object, which is the right
       division of labour. */
    .mark { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
    .mark img { width: 61px; height: 61px; }
    .mark span {
      font-family: var(--font-mark);
      font-weight: 600; font-size: 34px;
      letter-spacing: -0.01em;
      color: var(--ink-mark);
      line-height: 1;
    }
    /* The page's H1, at the page's weight and tracking. */
    h1 {
      font-family: var(--font-serif);
      font-weight: 700; font-size: 58px;
      line-height: 1.05; letter-spacing: -0.03em;
      margin-bottom: 10px;
    }
    /* The hero's one italic, and the reason the card now reads as the same
       product: a terracotta serif italic at half the headline, so the pair is
       a statement and its aside rather than two headlines. */
    .aside {
      font-family: var(--font-serif);
      font-style: italic; font-weight: 400;
      font-size: 29px; line-height: 1.2; letter-spacing: -0.01em;
      color: var(--terracotta-600);
      margin-bottom: 30px;
    }
    /* Darker than the page's own pill, on purpose. At full size the lighter
       treatment was the elegant one; social cards get shrunk aggressively and
       it was the first thing to wash out. Body ink and a border a step past
       --line, which is as far as it can go before it starts competing with
       the headline. */
    .badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-weight: 400; font-size: 17px; letter-spacing: 0.04em;
      color: var(--ink-700);
      border: 1px solid #C7AF98; border-radius: 999px;
      padding: 10px 20px;
    }
    /* NO DEVICE FRAME (Patrick, 2026-08-23). The bezel was doing one job -
       saying "this is an app" - and charging the card a lot of its width for
       it: at thumbnail size the frame is a grey border and the screen inside
       it is what a reader actually sees. Without it the desk is bigger in the
       same space and the card is about the PLACE rather than the hardware.
       The radius and shadow are the homepage hero's own (--r-3xl, --shadow-xl),
       which is what keeps a bare screenshot from reading as a raw crop bleeding
       into the paper. */
    .shot { justify-self: end; padding-right: 44px; }
    .shot img {
      width: 616px; height: auto; display: block;
      border-radius: 1.5rem;
      box-shadow: 0 20px 25px -5px #0000001a, 0 8px 10px -6px #0000001a;
    }
  </style>
</head>
<body>
  <div>
    <div class="mark">
      <img src="../assets/mark.png" alt="" />
      <span>Postmello</span>
    </div>
    <h1>A quiet place<br />for letters.</h1>
    <p class="aside">Without the rush of messaging.</p>
    <span class="badge">Coming first to iPad.</span>
  </div>
  <div class="shot">
    <!-- The screen-only crop, the same file the homepage hero uses. The
         bezelled app-desk.jpg stays in the repo but nothing renders it now. -->
    <img src="../assets/app-desk-screen.jpg" alt="" />
  </div>
</body>
</html>
