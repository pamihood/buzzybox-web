<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Postmello share card - source</title>
  <!-- The 1200x630 image a Postmello link unfurls as, authored as a PAGE rather
       than composed in PIL: the same browser, the same webfonts and the same
       tokens as the site render it, so it cannot quietly drift into a typeface
       the page has left. `make-og-card.py` shoots this file at 2x and
       downsamples.

       It HAS drifted, three times (2026-08-23 twice, then from 2026-09-10 to
       2026-09-15, when the homepage became the desk-and-letters design and the
       card kept advertising the previous hero for five days). Nothing fails
       loudly. When home.css changes a face, a token or the hero, change it
       here and rerun the script.

       REBUILT 2026-09-15 as the new hero: the painted desk room as the ground,
       the mailbox, paper rack, pen on its stack, stamps and stickers placed by
       the same percentages home.css uses (.desk-mailbox and friends), and the
       hero's own words. The desk-room rule and the object positions below are
       copied from home.css; if those move, move these.

       Not linked from anywhere and not in the sitemap - it is a source file
       that happens to be HTML. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- The site's families, exactly the line index.html loads. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" />
  <style>
    /* Straight from home.css (the second :root block wins there) and the
       .opening hero rules. If a token moves there, move it here. */
    :root {
      --paper: #fbf4e7;
      --ink: #443c32;
      --muted: #706454;
      --hero-em: #7b644c;
      --hero-detail: #635748;
      --font-serif: "Lora", Georgia, serif;
      --font-sans: "DM Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px; height: 630px;
      position: relative; overflow: hidden;
      font-family: var(--font-sans);
      color: var(--ink);
      font-synthesis: none;
      /* .desk-room, verbatim: the wall and the mint desk, the desk's rear edge
         at 62% of the height and its front lip from 96%. */
      background: #f5e8cf url("../assets/site/desk-backdrop.png") center 53.42% / 100% 157.48% no-repeat;
    }
    /* THE SIZE RULE - read this before changing any font-size here.
       Nothing on this card is sized against the other things on this card. It
       is sized against what it becomes in a feed: iMessage and WhatsApp render
       it near 300px wide, Slack near 360, X and Discord near 500, LinkedIn and
       Facebook near 550. That is 0.25x-0.46x, so ~30px here is the least a
       line can be set and survive a phone, and ~36px is where it reads
       comfortably. Test, do not estimate: render, downsample to 300px and
       360px, and look. A line that is illegible there is not on the card. */
    .copy {
      position: absolute; left: 64px; top: 54px; width: 540px; z-index: 1;
    }
    /* THE WORDMARK IS DRAWN - assets/wordmark.png, the same file the site
       header uses, no typeface at all. Sized by height, width auto: the aspect
       is the drawing's. The lockup leads because the card is a thumbnail in
       somebody else's feed long before it is a 1200px image, and the mark is
       what does the branding at 300px. */
    .mark { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
    .mark .glyph { width: 58px; height: 58px; }
    .mark .word { height: 35px; width: auto; display: block; }
    /* The hero's headline: Lora at the site's 500 (it loads no 700, and
       font-synthesis is off there too), the second line italic in the hero's
       brown. Two lines, as the page breaks it. */
    h1 {
      font-family: var(--font-serif);
      font-weight: 500; font-size: 66px;
      line-height: 1.1; letter-spacing: -0.04em;
      color: var(--ink);
    }
    h1 em { font-style: italic; font-weight: 500; color: var(--hero-em); }
    /* The hero's first sentence only. The page says two ("Staying in touch
       doesn't have to start with texting." follows), and both at a feed-legible
       size is four lines of sans fighting the serif for ink. The picture
       carries WHAT; the why stays on the page and in og:description, which
       every client sets at its own readable size. */
    .lead {
      margin-top: 20px;
      font-size: 32px; line-height: 1.3; font-weight: 400;
      color: var(--hero-detail);
      text-wrap: balance;
    }
    /* The hero's status line ("For iPad / One desk, free."), on one line. NOT
       Apple's badge: this card is an image in a timeline with nothing to
       click, and a download badge here would be a button that does nothing. */
    .status {
      margin-top: 22px;
      font-size: 28px; line-height: 1.3; font-weight: 500;
      color: var(--muted);
    }
    /* .desk-objects, verbatim from home.css: positions are percentages of the
       box, so the card's 1200x630 lays them out as the hero's 1320x650 does. */
    .objects { position: absolute; inset: 0; }
    .objects img { position: absolute; height: auto; }
    .mailbox { left: 44%; bottom: 14%; width: 29%; }
    .rack { right: 0; bottom: 24%; width: 26%; }
    .stack { left: 14%; bottom: 8%; width: 30%; }
    .stamp, .sticker {
      transform: scaleY(.62) rotate(var(--turn, 0deg));
      transform-origin: center bottom;
      filter: drop-shadow(0 2px 1px #594b393d);
    }
    .stamp { width: 5.5%; }
    .stamp-one { left: 74%; bottom: 12%; --turn: -6deg; }
    .stamp-two { left: 82%; bottom: 11.5%; --turn: 3deg; }
    .stamp-three { left: 90%; bottom: 12%; --turn: -3deg; }
    .sticker { width: 5.5%; }
    .sticker-one { left: 54%; bottom: 8%; --turn: -8deg; }
    .sticker-two { left: 63%; bottom: 9%; --turn: 7deg; }
  </style>
</head>
<body>
  <div class="copy">
    <div class="mark">
      <img class="glyph" src="../assets/mark.png" alt="" />
      <img class="word" src="../assets/wordmark.png" alt="Postmello" />
    </div>
    <h1>A quiet place<br /><em>for letters.</em></h1>
    <p class="lead">Write and draw digital letters with friends and family.</p>
    <p class="status">For iPad. One desk, free.</p>
  </div>
  <div class="objects">
    <img class="mailbox" src="../assets/hero/p-mailbox.webp" alt="" />
    <img class="rack" src="../assets/hero/p-rack.webp" alt="" />
    <img class="stack" src="../assets/hero/p-stack.webp" alt="" />
    <img class="stamp stamp-one" src="../assets/hero/p-stamp-bluebell.webp" alt="" />
    <img class="stamp stamp-two" src="../assets/hero/p-stamp-lighthouse.webp" alt="" />
    <img class="stamp stamp-three" src="../assets/hero/p-stamp-rainbow.webp" alt="" />
    <img class="sticker sticker-one" src="../assets/hero/p-sticker-toadstoolhouse.webp" alt="" />
    <img class="sticker sticker-two" src="../assets/hero/p-sticker-butterfly.webp" alt="" />
  </div>
</body>
</html>
