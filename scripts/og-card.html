<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Postmello share card - source</title>
  <!-- The 1200x630 image a Postmello link unfurls as, authored as a PAGE rather
       than composed in PIL: the same browser, the same webfonts and the same
       tokens as the site render it, so it cannot quietly drift into a typeface
       the page has left. `make-og-card.py` shoots this file at 2x and
       downsamples.

       It HAS drifted, three times (2026-08-23 twice, then from 2026-09-10 to
       2026-09-15, when the homepage became the desk-and-letters design and the
       card kept advertising the previous hero for five days). Nothing fails
       loudly. When home.css changes a face, a token or the hero, change it
       here and rerun the script.

       REBUILT 2026-09-22 with the homepage, when the hero became the desk
       film: the hero's cream ground, its words, and the film's thin iPad frame
       around the mint desk - the app's own original desk as a still
       (assets/site/desk.webp), never a frame from the film. The AI still life
       of the previous hero is gone from the card as it is from the page. The
       ground and the frame are copied from home.css (.opening, .film-screen);
       if those move, move these.

       Not linked from anywhere and not in the sitemap - it is a source file
       that happens to be HTML. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- The site's families, exactly the line index.html loads. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap" />
  <style>
    /* Straight from home.css (the second :root block wins there) and the
       .opening hero rules. If a token moves there, move it here. */
    :root {
      --paper: #fbf4e7;
      --ink: #443c32;
      --muted: #706454;
      --hero-em: #7b644c;
      --hero-detail: #635748;
      --font-serif: "Lora", Georgia, serif;
      --font-sans: "DM Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1200px; height: 630px;
      position: relative; overflow: hidden;
      font-family: var(--font-sans);
      color: var(--ink);
      font-synthesis: none;
      /* .opening, verbatim: the cream ground with its light behind the film. */
      background:
        radial-gradient(ellipse 58% 70% at 71% 42%, #fffaf1 0%, #fffaf100 70%),
        url("../assets/paper-grain.png") repeat,
        linear-gradient(#f7e9d3, #f2e1c7);
      background-size: auto, 128px, auto;
    }
    /* THE SIZE RULE - read this before changing any font-size here.
       Nothing on this card is sized against the other things on this card. It
       is sized against what it becomes in a feed: iMessage and WhatsApp render
       it near 300px wide, Slack near 360, X and Discord near 500, LinkedIn and
       Facebook near 550. That is 0.25x-0.46x, so ~30px here is the least a
       line can be set and survive a phone, and ~36px is where it reads
       comfortably. Test, do not estimate: render, downsample to 300px and
       360px, and look. A line that is illegible there is not on the card. */
    .copy {
      position: absolute; left: 72px; top: 50%; width: 470px; z-index: 1;
      transform: translateY(-50%);
    }
    /* THE WORDMARK IS DRAWN - assets/wordmark.png, the same file the site
       header uses, no typeface at all. Sized by height, width auto: the aspect
       is the drawing's. The lockup leads because the card is a thumbnail in
       somebody else's feed long before it is a 1200px image, and the mark is
       what does the branding at 300px. On the site the lockup is a header
       above the hero, not part of it, so it gets a header's distance here. */
    .mark { display: flex; align-items: center; gap: 13px; margin-bottom: 34px; }
    .mark .glyph { width: 52px; height: 52px; }
    .mark .word { height: 32px; width: auto; display: block; }
    /* The hero's headline: Lora at the site's 500 (it loads no 700, and
       font-synthesis is off there too), the second line italic in the hero's
       brown. Two lines, as the page breaks it. 72px: "place" needs real air
       before whatever sits to its right - at 88 the word ran into the old
       card's mailbox, at 80 it stopped 24px short and still read as touching
       (Patrick, 2026-09-15). The iPad keeps the same distance now. */
    h1 {
      font-family: var(--font-serif);
      font-weight: 500; font-size: 72px;
      line-height: 1.06; letter-spacing: -0.04em;
      color: var(--ink);
    }
    h1 em { font-style: italic; font-weight: 500; color: var(--hero-em); }
    /* NO SENTENCE UNDER THE HEADLINE (Patrick, 2026-09-15: "clean everything
       up"). The first render carried the hero's first sentence at 32px, and
       beside a 66px headline it flattened the ramp to 2:1 and crowded the
       desk's rear edge. The card is the drawn wordmark, the headline and the
       desk; og:description carries "Write and draw digital letters with
       friends and family..." and every client sets it at its own readable
       size under the picture. */
    /* NO STATUS LINE (Patrick, 2026-09-15). "For iPad. One desk, free." is the
       caption beside the App Store badge on the site; with no badge on the
       card it read as a stray sentence, and it landed on the desk's rear edge
       above the paper stack. The platform is on the page and in the listing. */
    /* .film-screen, at the card's scale: the thin dark bezel and its shadow,
       around the desk at 4:3. 560px wide leaves "place" its air. */
    .ipad {
      position: absolute; right: 64px; top: 50%; width: 560px;
      transform: translateY(-50%);
      border: 9px solid #253532; border-radius: 22px; overflow: hidden;
      background: #253532;
      box-shadow: 0 34px 56px -30px #3c2a1888, 0 12px 24px -16px #3c2a1844;
    }
    .ipad img { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; }
  </style>
</head>
<body>
  <div class="copy">
    <div class="mark">
      <img class="glyph" src="../assets/mark.png" alt="" />
      <img class="word" src="../assets/wordmark.png" alt="Postmello" />
    </div>
    <h1>A quiet place<br /><em>for letters.</em></h1>
  </div>
  <div class="ipad"><img src="../assets/site/desk.webp" alt="" /></div>
</body>
</html>
